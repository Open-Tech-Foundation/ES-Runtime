adapters = [
    "npm",
    "crates.io",
]
skip_publish = [
    "es-runtime",
    "es-runtime-cli-common",
    "es-runtime-common",
    "es-runtime-default-providers",
    "es-runtime-engine",
    "es-runtime-providers",
]
tag_format = "{name}@{version}"
provider = "github"
default_branch = "main"
changelog_strategy = "curated"
changelog_scope = "package"
github_release_notes = "curated-changelog"

[hooks]

[[setup]]
uses = "./.github/actions/setup-tsr"

[[setup]]
uses = "./.github/actions/setup-esdev"

[publish.ignore_paths]
es-runtime-cli = []
es-runtime = []
"@opentf/esrun-postgres" = [
    "**/*.md",
    "**/__tests__/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/test/**",
    "**/tests/**",
]
"@opentf/esrun-redis" = [
    "**/*.md",
    "**/__tests__/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/test/**",
    "**/tests/**",
]
es-runtime-default-providers = []
es-runtime-common = []
"@opentf/esrun-types" = [
    "**/*.md",
    "**/__tests__/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/test/**",
    "**/tests/**",
]
es-runtime-providers = []
es-runtime-engine = []

[[package]]
name = "@opentf/esrun-postgres"
adapter = "npm"
mode = "publish"
matrix = false
command = "tsr build"
artifacts = ""
manifest = "packages/postgres/package.json"

[[package]]
name = "@opentf/esrun-redis"
adapter = "npm"
mode = "publish"
matrix = false
command = "tsr build"
artifacts = ""
manifest = "packages/redis/package.json"

[[package]]
name = "@opentf/esrun-types"
adapter = "npm"
mode = "publish"
matrix = false
command = ""
artifacts = ""
manifest = "packages/types/package.json"

[[package]]
name = "es-runtime-cli"
adapter = "crates.io"
setup = []
mode = "build-only"
matrix = true
command = "cargo build --release --target {triple}"
artifacts = "target/{triple}/release/{bin}{ext}"
bin_name = "esrun"
attest = true
checksums = true
tag_format = "esrun@{version}"
legacy_tag_formats = ["v{version}"]

[[package.targets]]
name = "linux"
arch = "x86_64"
triple = "x86_64-unknown-linux-gnu"
runner = "ubuntu-latest"
stage_as = "linux-x64"

[[package.targets]]
name = "linux"
arch = "aarch64"
triple = "aarch64-unknown-linux-gnu"
runner = "ubuntu-latest"
stage_as = "linux-arm64"
cross = true

[[package.targets]]
name = "macos"
arch = "aarch64"
triple = "aarch64-apple-darwin"
runner = "macos-latest"
stage_as = "darwin-arm64"

[[package.targets]]
name = "macos"
arch = "x86_64"
triple = "x86_64-apple-darwin"
runner = "macos-latest"
stage_as = "darwin-x64"

[[package.targets]]
name = "windows"
arch = "x86_64"
triple = "x86_64-pc-windows-msvc"
runner = "windows-latest"
stage_as = "win32-x64"
ext = ".exe"

[[package.targets]]
name = "windows"
arch = "aarch64"
triple = "aarch64-pc-windows-msvc"
runner = "windows-latest"
stage_as = "win32-arm64"
ext = ".exe"

[[package]]
name = "es-runtime-dev-cli"
adapter = "crates.io"
setup = []
mode = "build-only"
matrix = true
command = "cargo build --release --target {triple}"
artifacts = "target/{triple}/release/{bin}{ext}"
bin_name = "esdev"
manifest = "crates/dev-cli/Cargo.toml"
attest = true
checksums = true
tag_format = "esdev@{version}"

[[package.targets]]
name = "linux"
arch = "x86_64"
triple = "x86_64-unknown-linux-gnu"
runner = "ubuntu-latest"
stage_as = "linux-x64"

[[package.targets]]
name = "linux"
arch = "aarch64"
triple = "aarch64-unknown-linux-gnu"
runner = "ubuntu-latest"
stage_as = "linux-arm64"
cross = true

[[package.targets]]
name = "macos"
arch = "aarch64"
triple = "aarch64-apple-darwin"
runner = "macos-latest"
stage_as = "darwin-arm64"

[[package.targets]]
name = "macos"
arch = "x86_64"
triple = "x86_64-apple-darwin"
runner = "macos-latest"
stage_as = "darwin-x64"

[[package.targets]]
name = "windows"
arch = "x86_64"
triple = "x86_64-pc-windows-msvc"
runner = "windows-latest"
stage_as = "win32-x64"
ext = ".exe"

[[package.targets]]
name = "windows"
arch = "aarch64"
triple = "aarch64-pc-windows-msvc"
runner = "windows-latest"
stage_as = "win32-arm64"
ext = ".exe"
