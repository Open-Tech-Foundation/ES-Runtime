adapters = [
    "npm",
    "crates.io",
]
skip_publish = [
    "es-runtime",
    "es-runtime-cli-common",
    "es-runtime-common",
    "es-runtime-default-providers",
    "es-runtime-engine",
    "es-runtime-providers",
]
tag_format = "{name}@{version}"
provider = "github"
default_branch = "main"
changelog_strategy = "curated"
changelog_scope = "package"
github_release_notes = "curated-changelog"

[hooks]

[[setup]]
uses = "./.github/actions/setup-tsr"

[[setup]]
uses = "./.github/actions/setup-esdev"

[publish.ignore_paths]
es-runtime-default-providers = []
"@opentf/esrun-smtp" = [
    "**/*.md",
    "**/__tests__/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/test/**",
    "**/tests/**",
]
"@opentf/esrun-types" = [
    "**/*.md",
    "**/__tests__/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/test/**",
    "**/tests/**",
]
es-runtime = []
es-runtime-cli = []
es-runtime-providers = []
"@opentf/esrun-postgres" = [
    "**/*.md",
    "**/__tests__/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/test/**",
    "**/tests/**",
]
"@opentf/esrun-redis" = [
    "**/*.md",
    "**/__tests__/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/test/**",
    "**/tests/**",
]
es-runtime-engine = []
"@opentf/esrun-mysql" = [
    "**/*.md",
    "**/__tests__/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/test/**",
    "**/tests/**",
]
es-runtime-common = []

[[package]]
name = "@opentf/esrun-mysql"
adapter = "npm"
mode = "publish"
matrix = false
command = "npm run build"
artifacts = ""
manifest = "packages/mysql/package.json"

[[package]]
name = "@opentf/esrun-postgres"
adapter = "npm"
mode = "publish"
matrix = false
command = "tsr build"
artifacts = ""
manifest = "packages/postgres/package.json"

[[package]]
name = "@opentf/esrun-redis"
adapter = "npm"
mode = "publish"
matrix = false
command = "tsr build"
artifacts = ""
manifest = "packages/redis/package.json"

[[package]]
name = "@opentf/esrun-smtp"
adapter = "npm"
mode = "publish"
matrix = false
command = "npm run build"
artifacts = ""
manifest = "packages/smtp/package.json"

[[package]]
name = "@opentf/esrun-types"
adapter = "npm"
mode = "publish"
matrix = false
command = ""
artifacts = ""
manifest = "packages/types/package.json"

[[package]]
name = "@opentf/esdev-plugin-react"
adapter = "npm"
mode = "publish"
matrix = false
command = ""
artifacts = ""
manifest = "packages/esdev-plugin-react/package.json"

[[package]]
name = "es-runtime-cli"
adapter = "crates.io"
mode = "build-only"
matrix = true
command = "cargo build --release --target {triple}"
artifacts = "target/{triple}/release/{bin}{ext}"
bin_name = "esrun"
attest = true
checksums = true
tag_format = "esrun@{version}"
legacy_tag_formats = ["v{version}"]

[[package.targets]]
name = "linux"
arch = "x86_64"
triple = "x86_64-unknown-linux-gnu"
runner = "ubuntu-latest"
stage_as = "linux-x64"

[[package.targets]]
name = "linux"
arch = "aarch64"
triple = "aarch64-unknown-linux-gnu"
runner = "ubuntu-latest"
stage_as = "linux-arm64"
cross = true

[[package.targets]]
name = "macos"
arch = "aarch64"
triple = "aarch64-apple-darwin"
runner = "macos-latest"
stage_as = "darwin-arm64"

[[package.targets]]
name = "macos"
arch = "x86_64"
triple = "x86_64-apple-darwin"
runner = "macos-latest"
stage_as = "darwin-x64"

[[package.targets]]
name = "windows"
arch = "x86_64"
triple = "x86_64-pc-windows-msvc"
runner = "windows-latest"
stage_as = "win32-x64"
ext = ".exe"

[[package.targets]]
name = "windows"
arch = "aarch64"
triple = "aarch64-pc-windows-msvc"
runner = "windows-latest"
stage_as = "win32-arm64"
ext = ".exe"

# Both CLIs are one cargo workspace and share all but a handful of
# dependencies, so the two jobs for a triple share one cache entry instead of
# storing the same half-gigabyte twice: six entries rather than twelve, which
# keeps this inside the repository's 10 GB cache budget beside ci.yml's.
# `librusty_v8.a` is a 178 MB prebuilt the `v8` build script fetches into
# `gn_out`, beside the directories rust-cache knows about; restoring it is what
# lets the script skip the download. `targets` names every triple so the step
# is emitted only in the build jobs, where `matrix.triple` exists.
[[package.setup]]
uses = "Swatinem/rust-cache@v2"
with = { shared-key = "release-${{ matrix.triple }}", cache-directories = "target/${{ matrix.triple }}/release/gn_out" }
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[[package]]
name = "es-runtime-dev-cli"
adapter = "crates.io"
mode = "build-only"
matrix = true
# `-p`, so that the inspector switch this build carries (release.yml) can only
# ever reach esdev, wherever the command is run from.
command = "cargo build --release -p es-runtime-dev-cli --target {triple}"
artifacts = "target/{triple}/release/{bin}{ext}"
bin_name = "esdev"
manifest = "crates/dev-cli/Cargo.toml"
attest = true
checksums = true
tag_format = "esdev@{version}"

[[package.targets]]
name = "linux"
arch = "x86_64"
triple = "x86_64-unknown-linux-gnu"
runner = "ubuntu-latest"
stage_as = "linux-x64"

[[package.targets]]
name = "linux"
arch = "aarch64"
triple = "aarch64-unknown-linux-gnu"
runner = "ubuntu-latest"
stage_as = "linux-arm64"
cross = true

[[package.targets]]
name = "macos"
arch = "aarch64"
triple = "aarch64-apple-darwin"
runner = "macos-latest"
stage_as = "darwin-arm64"

[[package.targets]]
name = "macos"
arch = "x86_64"
triple = "x86_64-apple-darwin"
runner = "macos-latest"
stage_as = "darwin-x64"

[[package.targets]]
name = "windows"
arch = "x86_64"
triple = "x86_64-pc-windows-msvc"
runner = "windows-latest"
stage_as = "win32-x64"
ext = ".exe"

[[package.targets]]
name = "windows"
arch = "aarch64"
triple = "aarch64-pc-windows-msvc"
runner = "windows-latest"
stage_as = "win32-arm64"
ext = ".exe"

# Both CLIs are one cargo workspace and share all but a handful of
# dependencies, so the two jobs for a triple share one cache entry instead of
# storing the same half-gigabyte twice: six entries rather than twelve, which
# keeps this inside the repository's 10 GB cache budget beside ci.yml's.
# `librusty_v8.a` is a 178 MB prebuilt the `v8` build script fetches into
# `gn_out`, beside the directories rust-cache knows about; restoring it is what
# lets the script skip the download. `targets` names every triple so the step
# is emitted only in the build jobs, where `matrix.triple` exists.
[[package.setup]]
uses = "Swatinem/rust-cache@v2"
with = { shared-key = "release-${{ matrix.triple }}", cache-directories = "target/${{ matrix.triple }}/release/gn_out" }
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

# With the V8 inspector, for `esdev --inspect` and `esdev test --coverage`
# (DECISIONS D59, D108). Set for the build step through $GITHUB_ENV; esrun's
# build script refuses the variable, which `-p es-runtime-dev-cli` keeps away.
[[package.setup]]
run = ['echo "ES_RUNTIME_INSPECTOR=1" >> "$GITHUB_ENV"']
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
