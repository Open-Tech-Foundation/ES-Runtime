packages:
  - packages/*
  - crates/runtime/js
  - crates/dev-cli/js
  - bench

# These packages install platform binaries used by the benchmark or the
# serialization build. pnpm otherwise declines lifecycle scripts until each
# required dependency is named here.
allowBuilds:
  '@bufbuild/buf': true
  cbor-extract: true
  esbuild: true
  msgpackr-extract: true
