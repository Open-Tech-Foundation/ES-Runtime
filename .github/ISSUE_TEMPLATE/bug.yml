name: Bug report
description: Something in esrun, esdev or a package does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead (paste the error).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest code and command that shows it. A few lines beats a whole project.
      placeholder: |
        // main.js
        ...

        $ esrun --allow-net main.js
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: The output of `esrun --version` (or `esdev --version`), and your OS and CPU.
      placeholder: esrun 0.41.0 · Linux x64
    validations:
      required: true
