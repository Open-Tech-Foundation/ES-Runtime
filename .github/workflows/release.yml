      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-tsr
      - uses: ./.github/actions/setup-esdev
      - name: Build @opentf/esrun-postgres
        run: tsr build
