      - name: Install release
        if: runner.os != 'Windows'
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.41.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.41.0/install.sh | bash
      - name: Expose release command
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if ! command -v release >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/release-cli"
            cp "$(command -v otf-release)" "$RUNNER_TEMP/release-cli/release"
            echo "$RUNNER_TEMP/release-cli" >> "$GITHUB_PATH"
          fi
      - name: Install release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OTF_RELEASE_VERSION: v0.41.0
        run: irm https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.41.0/install.ps1 | iex
      - name: Expose release command
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command release -ErrorAction SilentlyContinue)) {
            $cliDir = Join-Path $env:RUNNER_TEMP 'release-cli'
            New-Item -ItemType Directory -Force -Path $cliDir | Out-Null
            Copy-Item (Get-Command otf-release).Source (Join-Path $cliDir 'release.exe')
            $cliDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: "target/${{ matrix.triple }}/release/gn_out"
          shared-key: "release-${{ matrix.triple }}"
      - name: Build es-runtime-dev-cli
        run: release build --package es-runtime-dev-cli --target ${{ matrix.name }}/${{ matrix.arch }}
        env:
          ES_RUNTIME_INSPECTOR: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: es-runtime-dev-cli-${{ matrix.name }}-${{ matrix.arch }}
          path: .artifacts/es-runtime-dev-cli

  publish-opentf-esrun-mysql:
    needs: [check-release]
    if: needs.check-release.outputs.release_opentf_esrun_mysql == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-tsr
      - uses: ./.github/actions/setup-esdev
      - name: Build @opentf/esrun-mysql
        run: npm run build
        working-directory: packages/mysql
      - name: Install release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.41.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.41.0/install.sh | bash
      - name: Expose release command
        shell: bash
        run: |
          if ! command -v release >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/release-cli"
