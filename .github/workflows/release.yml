name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write  # create tags and GitHub Releases
  id-token: write
  attestations: write  # sign build provenance for release assets

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      release_opentf_esrun_postgres: ${{ steps.check.outputs.release_opentf_esrun_postgres }}
      release_opentf_esrun_redis: ${{ steps.check.outputs.release_opentf_esrun_redis }}
      release_es_runtime_cli: ${{ steps.check.outputs.release_es_runtime_cli }}
      release_es_runtime_dev_cli: ${{ steps.check.outputs.release_es_runtime_dev_cli }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install otf-release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.sh | bash
      - uses: ./.github/actions/setup-tsr
      - uses: ./.github/actions/setup-esdev
      - id: check
        run: |
          echo "should_release=$(otf-release check --exclude-package @opentf/esrun-postgres --exclude-package @opentf/esrun-redis --exclude-package es-runtime-cli --exclude-package es-runtime-dev-cli)" >> "$GITHUB_OUTPUT"
          echo "release_opentf_esrun_postgres=$(otf-release check --package @opentf/esrun-postgres)" >> "$GITHUB_OUTPUT"
          echo "release_opentf_esrun_redis=$(otf-release check --package @opentf/esrun-redis)" >> "$GITHUB_OUTPUT"
          echo "release_es_runtime_cli=$(otf-release check --package es-runtime-cli)" >> "$GITHUB_OUTPUT"
          echo "release_es_runtime_dev_cli=$(otf-release check --package es-runtime-dev-cli)" >> "$GITHUB_OUTPUT"

  matrix-es-runtime-cli:
    needs: [check-release]
    if: needs.check-release.outputs.release_es_runtime_cli == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Install otf-release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.sh | bash
      - id: set
        run: echo "matrix=$(otf-release matrix --package es-runtime-cli)" >> "$GITHUB_OUTPUT"

  build-es-runtime-cli:
    needs: [check-release, matrix-es-runtime-cli]
    if: needs.check-release.outputs.release_es_runtime_cli == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-es-runtime-cli.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        if: ${{ matrix.cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.arch }}-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Both CLIs are one cargo workspace and share all but a handful of
          # dependencies, so the two jobs for a triple share one cache entry
          # instead of storing the same half-gigabyte twice. Six entries rather
          # than twelve, which is what keeps this inside the repository's 10 GB
          # cache budget with ci.yml's entries alongside it.
          shared-key: release-${{ matrix.triple }}
          # `librusty_v8.a` is a 178 MB prebuilt that the `v8` build script
          # fetches, and it lands in `gn_out` — beside the three directories
          # rust-cache knows about, not inside them, so the default set misses
          # it and every job re-downloads it. The script skips the download when
          # the `.sum` file next to the archive still names the same URL, so
          # restoring this directory is what makes that skip happen.
          cache-directories: target/${{ matrix.triple }}/release/gn_out
      - name: Install otf-release
        if: runner.os != 'Windows'
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.sh | bash
      - name: Install otf-release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: irm https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.ps1 | iex
      - name: Build es-runtime-cli
        run: otf-release build --package es-runtime-cli --target ${{ matrix.name }}/${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: es-runtime-cli-${{ matrix.name }}-${{ matrix.arch }}
          path: .artifacts/es-runtime-cli

  matrix-es-runtime-dev-cli:
    needs: [check-release]
    if: needs.check-release.outputs.release_es_runtime_dev_cli == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Install otf-release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.sh | bash
      - id: set
        run: echo "matrix=$(otf-release matrix --package es-runtime-dev-cli)" >> "$GITHUB_OUTPUT"

  build-es-runtime-dev-cli:
    needs: [check-release, matrix-es-runtime-dev-cli]
    if: needs.check-release.outputs.release_es_runtime_dev_cli == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-es-runtime-dev-cli.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        if: ${{ matrix.cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.arch }}-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Both CLIs are one cargo workspace and share all but a handful of
          # dependencies, so the two jobs for a triple share one cache entry
          # instead of storing the same half-gigabyte twice. Six entries rather
          # than twelve, which is what keeps this inside the repository's 10 GB
          # cache budget with ci.yml's entries alongside it.
          shared-key: release-${{ matrix.triple }}
          # `librusty_v8.a` is a 178 MB prebuilt that the `v8` build script
          # fetches, and it lands in `gn_out` — beside the three directories
          # rust-cache knows about, not inside them, so the default set misses
          # it and every job re-downloads it. The script skips the download when
          # the `.sum` file next to the archive still names the same URL, so
          # restoring this directory is what makes that skip happen.
          cache-directories: target/${{ matrix.triple }}/release/gn_out
      - name: Install otf-release
        if: runner.os != 'Windows'
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.sh | bash
      - name: Install otf-release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: irm https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.ps1 | iex
      - name: Build es-runtime-dev-cli
        run: otf-release build --package es-runtime-dev-cli --target ${{ matrix.name }}/${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: es-runtime-dev-cli-${{ matrix.name }}-${{ matrix.arch }}
          path: .artifacts/es-runtime-dev-cli

  publish-opentf-esrun-postgres:
    needs: [check-release]
    if: needs.check-release.outputs.release_opentf_esrun_postgres == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/setup-tsr
      - uses: ./.github/actions/setup-esdev
      - name: Build @opentf/esrun-postgres
        run: tsr build
        working-directory: packages/postgres
      - name: Install otf-release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.sh | bash
      - name: Publish
        run: otf-release publish --package @opentf/esrun-postgres
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-opentf-esrun-redis:
    needs: [check-release]
    if: needs.check-release.outputs.release_opentf_esrun_redis == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - uses: ./.github/actions/setup-tsr
      - uses: ./.github/actions/setup-esdev
      - name: Build @opentf/esrun-redis
        run: tsr build
        working-directory: packages/redis
      - name: Install otf-release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.sh | bash
      - name: Publish
        run: otf-release publish --package @opentf/esrun-redis
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [check-release, publish-opentf-esrun-postgres, publish-opentf-esrun-redis]
    if: >-
      always() &&
      needs.check-release.outputs.should_release == 'true' &&
      needs.publish-opentf-esrun-postgres.result != 'failure' &&
      needs.publish-opentf-esrun-postgres.result != 'cancelled' &&
      needs.publish-opentf-esrun-redis.result != 'failure' &&
      needs.publish-opentf-esrun-redis.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Install otf-release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.sh | bash
      - uses: ./.github/actions/setup-tsr
      - uses: ./.github/actions/setup-esdev
      - name: Publish
        run: otf-release publish --exclude-package @opentf/esrun-postgres --exclude-package @opentf/esrun-redis
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release-es-runtime-cli:
    needs: [check-release, build-es-runtime-cli]
    if: needs.check-release.outputs.release_es_runtime_cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: .artifacts
      - name: Install otf-release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.sh | bash
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: otf-release github-release --package es-runtime-cli --artifacts-dir .artifacts
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: .artifacts/.flat-es-runtime-cli/*

  github-release-es-runtime-dev-cli:
    needs: [check-release, build-es-runtime-dev-cli]
    if: needs.check-release.outputs.release_es_runtime_dev_cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: .artifacts
      - name: Install otf-release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.38.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.38.0/install.sh | bash
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: otf-release github-release --package es-runtime-dev-cli --artifacts-dir .artifacts
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: .artifacts/.flat-es-runtime-dev-cli/*

