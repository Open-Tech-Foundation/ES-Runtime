  build-es-runtime-dev-cli:
    needs: [check-release, matrix-es-runtime-dev-cli]
    if: needs.check-release.outputs.release_es_runtime_dev_cli == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-es-runtime-dev-cli.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        if: ${{ matrix.cross }}
        run: |
