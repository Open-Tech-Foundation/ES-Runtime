# Generated from release.toml by `release` · sha256:26bac904ea87c1d5866df2fbfb40a297d648137fe1f6a98552d9a163226d173a
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write  # create tags and GitHub Releases
  id-token: write
  attestations: write  # sign build provenance for release assets

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      release_opentf_esrun_mysql: ${{ steps.check.outputs.release_opentf_esrun_mysql }}
      release_opentf_esrun_postgres: ${{ steps.check.outputs.release_opentf_esrun_postgres }}
      release_opentf_esrun_redis: ${{ steps.check.outputs.release_opentf_esrun_redis }}
      release_opentf_esrun_smtp: ${{ steps.check.outputs.release_opentf_esrun_smtp }}
      release_es_runtime_cli: ${{ steps.check.outputs.release_es_runtime_cli }}
      release_es_runtime_dev_cli: ${{ steps.check.outputs.release_es_runtime_dev_cli }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.41.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.41.0/install.sh | bash
      - name: Expose release command
        shell: bash
        run: |
          if ! command -v release >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/release-cli"
            cp "$(command -v otf-release)" "$RUNNER_TEMP/release-cli/release"
            echo "$RUNNER_TEMP/release-cli" >> "$GITHUB_PATH"
          fi
      - uses: ./.github/actions/setup-tsr
      - uses: ./.github/actions/setup-esdev
      - id: check
        run: |
          echo "should_release=$(release check --exclude-package @opentf/esrun-mysql --exclude-package @opentf/esrun-postgres --exclude-package @opentf/esrun-redis --exclude-package @opentf/esrun-smtp --exclude-package es-runtime-cli --exclude-package es-runtime-dev-cli)" >> "$GITHUB_OUTPUT"
          echo "release_opentf_esrun_mysql=$(release check --package @opentf/esrun-mysql)" >> "$GITHUB_OUTPUT"
          echo "release_opentf_esrun_postgres=$(release check --package @opentf/esrun-postgres)" >> "$GITHUB_OUTPUT"
          echo "release_opentf_esrun_redis=$(release check --package @opentf/esrun-redis)" >> "$GITHUB_OUTPUT"
          echo "release_opentf_esrun_smtp=$(release check --package @opentf/esrun-smtp)" >> "$GITHUB_OUTPUT"
          echo "release_es_runtime_cli=$(release check --package es-runtime-cli)" >> "$GITHUB_OUTPUT"
          echo "release_es_runtime_dev_cli=$(release check --package es-runtime-dev-cli)" >> "$GITHUB_OUTPUT"

  matrix-es-runtime-cli:
    needs: [check-release]
    if: needs.check-release.outputs.release_es_runtime_cli == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Install release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.41.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.41.0/install.sh | bash
      - name: Expose release command
        shell: bash
        run: |
          if ! command -v release >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/release-cli"
            cp "$(command -v otf-release)" "$RUNNER_TEMP/release-cli/release"
            echo "$RUNNER_TEMP/release-cli" >> "$GITHUB_PATH"
          fi
      - id: set
        run: echo "matrix=$(release matrix --package es-runtime-cli)" >> "$GITHUB_OUTPUT"

  build-es-runtime-cli:
    needs: [check-release, matrix-es-runtime-cli]
    if: needs.check-release.outputs.release_es_runtime_cli == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-es-runtime-cli.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        if: ${{ matrix.cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.arch }}-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - name: Install release
        if: runner.os != 'Windows'
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.41.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.41.0/install.sh | bash
      - name: Expose release command
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if ! command -v release >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/release-cli"
            cp "$(command -v otf-release)" "$RUNNER_TEMP/release-cli/release"
            echo "$RUNNER_TEMP/release-cli" >> "$GITHUB_PATH"
          fi
      - name: Install release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OTF_RELEASE_VERSION: v0.41.0
        run: irm https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.41.0/install.ps1 | iex
      - name: Expose release command
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command release -ErrorAction SilentlyContinue)) {
            $cliDir = Join-Path $env:RUNNER_TEMP 'release-cli'
            New-Item -ItemType Directory -Force -Path $cliDir | Out-Null
            Copy-Item (Get-Command otf-release).Source (Join-Path $cliDir 'release.exe')
            $cliDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: "target/${{ matrix.triple }}/release/gn_out"
          shared-key: "release-${{ matrix.triple }}"
      - name: Build es-runtime-cli
        run: release build --package es-runtime-cli --target ${{ matrix.name }}/${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: es-runtime-cli-${{ matrix.name }}-${{ matrix.arch }}
          path: .artifacts/es-runtime-cli

  matrix-es-runtime-dev-cli:
    needs: [check-release]
    if: needs.check-release.outputs.release_es_runtime_dev_cli == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Install release
        shell: bash
        env:
          OTF_RELEASE_VERSION: v0.41.0
        run: curl -fsSL https://raw.githubusercontent.com/Open-Tech-Foundation/release/v0.41.0/install.sh | bash
      - name: Expose release command
