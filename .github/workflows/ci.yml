# CI gates for ES-Runtime (SPEC.md §5). All jobs are required.
#
# The `v8` crate downloads a prebuilt static library at build time, so the
# clippy/test/msrv jobs need network and benefit from the Rust cache. The
# toolchain is pinned by rust-toolchain.toml (1.95.0); the MSRV job exists to
# assert the declared `rust-version` actually builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref; cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  clippy:
    name: clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Build first so the `v8` crate fetches its prebuilt static lib. Clippy
      # runs in check mode, which doesn't trigger that download on a cold cache;
      # deps build with normal rustc (only workspace crates use clippy-driver),
      # so clippy then reuses the v8 artifact.
      - run: cargo build --workspace --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Behavioral tests run on all three tier-1 platforms: filesystem/path semantics
  # (separators, drive letters, the symlink-canonicalized root jail), process exit
  # codes, networking (half-close, localhost, streaming upload), and CRLF/encoding
  # handling genuinely differ off Linux even though the Rust source is identical,
  # so Linux-only coverage misses them. The `v8` crate ships prebuilt static libs
  # for x86_64-pc-windows-msvc and aarch64-apple-darwin, so no source V8 build is
  # needed. `fail-fast: false` so one platform's failure still reports the others.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      # The same conformance suite the `conformance_suite_passes` gate runs,
      # driven instead by the real CLI: a real event loop, a real filesystem,
      # real process exit. It exits non-zero on any failure. One platform is
      # enough — this checks the driver, not platform semantics — and the binary
      # is already built by the step above.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo run -p es-runtime-cli -- crates/runtime/conformance/run.js

  # The pure-JS half of `runtime:serialization` (the Protobuf implementation) is
  # written in TypeScript under crates/runtime/js and bundled into the embedded
  # module. Its own test suite is not reachable from `cargo test`, so without
  # this job the largest hand-written JS subsystem in the repo gates on nothing.
  js:
    name: js (bun test + bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/runtime/js
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      # The bundle is committed (the runtime embeds it at compile time), so it
      # can drift from the source it was built from and nothing would notice
      # until a behaviour bug. Rebuild and require the tree to be unchanged.
      - run: bun run build
      - run: git diff --exit-code -- ../src/runtime_modules/serialization.js

  docs:
    name: docs (generated pages in sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Site pages under app/docs/internals are generated from docs/internals/*.md.
      # Same reasoning as the committed JS bundle above: a generated file that is
      # committed can drift from its source and nothing notices until a reader
      # believes the stale one.
      - run: node website/scripts/gen-internals.mjs
      - run: git diff --exit-code -- website/app/docs/internals
      # Note: `bench/probe-runtimes.sh --check` is deliberately *not* run here.
      # It needs node, bun and deno installed, takes ~15 minutes, and measures
      # other runtimes — so it would fail on their release schedule rather than
      # on a change of ours. Re-run it by hand when the table is being refreshed.

  msrv:
    name: msrv build (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Build with the declared MSRV explicitly, overriding rust-toolchain.toml.
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 build --workspace --all-features

  # Fuzzing (SPEC §5). Each target gets a bounded run seeded from the committed
  # corpus in `fuzz/seeds/` — which includes the inputs that have found bugs, so
  # a regression is caught in the first seconds rather than rediscovered. This is
  # a smoke run, not a campaign: long-running fuzzing belongs on dedicated
  # infrastructure, and the point here is that the targets build and that no
  # committed seed crashes.
  fuzz:
    name: cargo-fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nfuzz -> fuzz/target"
      # cargo-fuzz builds with a sanitizer, which needs nightly.
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run each target for 60s
        run: |
          set -euo pipefail
          for target in url encoding urlpattern compression serialization keys; do
            echo "::group::fuzz $target"
            # New coverage-increasing inputs go to the (gitignored) corpus
            # directory; the seeds are read-only, so a run cannot bloat them.
            cargo +nightly fuzz run "$target" \
              "fuzz/corpus/$target" "fuzz/seeds/$target" \
              -- -max_total_time=60 -rss_limit_mb=4096
            echo "::endgroup::"
          done
      # A crash writes its input here; keep it so the failure is reproducible
      # from the run rather than only from whoever can rerun the fuzzer.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/

  # Miri (SPEC §5) over the crates that do not link V8. `engine` and everything
  # above it cannot run here: Miri interprets Rust, and V8 is a prebuilt native
  # library it cannot execute. Checking that boundary needs ASAN over a V8 built
  # from source with `-fsanitize=address` — see SPEC §5 for why that is not a job
  # here yet.
  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri test -p es-runtime-common -p es-runtime-providers

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
