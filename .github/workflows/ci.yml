# The core gates for ES-Runtime (SPEC.md §5): formatting, clippy, the test
# matrix, and Miri over the unsafe FFI seam. These run on every pull request.
#
# Every step is `tsr <task>`. The commands live in tasks.toml, so what CI runs
# and what you run cannot drift — and `tsr <task> --dry-run` tells you exactly
# what a job will do.
#
# Two companions carry the rest, so a change pays only for what it can break:
#   .github/workflows/js.yml         the drivers and the serialization bundle
#   .github/workflows/hardening.yml  MSRV, fuzzing, cargo-deny, cargo-audit
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job has a time limit. Without one a hung test holds a runner for
# GitHub's six hours and the run reports nothing until then; the Windows test
# job did exactly that while esdev waited on a browser's pipe.
#
# Real-browser tests are not run here. They need a browser and driver pair the
# runner images change under us, and they cost more than they catch; run them
# locally with `ESDEV_TEST_BROWSER=chrome tsr test:browser`.

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tsr
      - run: tsr fmt
      - run: tsr path-discipline
      - run: tsr fs-discipline

  clippy:
    name: clippy -D warnings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          # `librusty_v8.a` is a 178 MB prebuilt the `v8` build script fetches,
          # and it lands beside the directories rust-cache caches by default
          # rather than inside them — so without this every job downloads it
          # again. The script skips the fetch when the `.sum` file next to the
          # archive still names the same URL, which restoring this gives it.
          cache-directories: |
            target/debug/gn_out
            target/release/gn_out
      - uses: ./.github/actions/setup-tsr
      - run: tsr clippy

  # Behavioral tests run on all three tier-1 platforms: filesystem/path semantics
  # (separators, drive letters, the symlink-canonicalized root jail), process exit
  # codes, networking (half-close, localhost, streaming upload), and CRLF/encoding
  # handling genuinely differ off Linux even though the Rust source is identical,
  # so Linux-only coverage misses them. The `v8` crate ships prebuilt static libs
  # for x86_64-pc-windows-msvc and aarch64-apple-darwin, so no source V8 build is
  # needed. `fail-fast: false` so one platform's failure still reports the others.
  #
  # esrun and esdev are separate jobs: a failure in one does not hide the
  # other's result, and each saves its own build cache. rust-cache saves only
  # when a job succeeds, so while both shared one job, an esdev problem on
  # Linux meant that leg never had a cache and rebuilt everything every run.
  test:
    name: test ${{ matrix.suite }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        suite: [esrun, esdev]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per suite: they build different test binaries.
          key: ${{ matrix.suite }}
          # Saved when the tests fail too: the build is still good, and a job
          # that never saves rebuilds the whole tree on every run.
          cache-on-failure: true
          # `librusty_v8.a` is a 178 MB prebuilt the `v8` build script fetches,
          # and it lands beside the directories rust-cache caches by default
          # rather than inside them — so without this every job downloads it
          # again. The script skips the fetch when the `.sum` file next to the
          # archive still names the same URL, which restoring this gives it.
          cache-directories: |
            target/debug/gn_out
            target/release/gn_out
      - uses: ./.github/actions/setup-tsr
      - if: matrix.suite != 'esdev' || runner.os != 'Linux'
        run: tsr test:${{ matrix.suite }}
      # For now, one test at a time in esdev's suite on Linux: something in it
      # stops the runner there with no error, and with tests in parallel the
      # last name printed is not necessarily the one that did.
      # What already listens on this runner, and which process: esdev's suite
      # serves and fetches on fixed ports in 20000-29999, and a port the
      # runner's own agents hold is one a test must not talk to.
      - if: matrix.suite == 'esdev' && runner.os == 'Linux'
        run: sudo ss -ltnp
      - if: matrix.suite == 'esdev' && runner.os == 'Linux'
        run: tsr test:esdev
        env:
          RUST_TEST_THREADS: 1
      # One platform is enough for the conformance suite — it checks the driver,
      # not platform semantics — and the binary is already built above.
      - if: matrix.os == 'ubuntu-latest' && matrix.suite == 'esrun'
        run: tsr conformance

  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          # `librusty_v8.a` is a 178 MB prebuilt the `v8` build script fetches,
          # and it lands beside the directories rust-cache caches by default
          # rather than inside them — so without this every job downloads it
          # again. The script skips the fetch when the `.sum` file next to the
          # archive still names the same URL, which restoring this gives it.
          cache-directories: |
            target/debug/gn_out
            target/release/gn_out
      - uses: ./.github/actions/setup-tsr
      - run: tsr miri
