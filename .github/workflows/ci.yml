# The core gates for ES-Runtime (SPEC.md §5): formatting, clippy, the test
# matrix, and Miri over the unsafe FFI seam. These run on every pull request.
#
# Every step is `tsr <task>`. The commands live in tasks.toml, so what CI runs
# and what you run cannot drift — and `tsr <task> --dry-run` tells you exactly
# what a job will do.
#
# Two companions carry the rest, so a change pays only for what it can break:
#   .github/workflows/js.yml         the drivers and the serialization bundle
#   .github/workflows/hardening.yml  MSRV, fuzzing, cargo-deny, cargo-audit
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tsr
      - run: tsr fmt

  clippy:
    name: clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/tsr
      - run: tsr clippy

  # Behavioral tests run on all three tier-1 platforms: filesystem/path semantics
  # (separators, drive letters, the symlink-canonicalized root jail), process exit
  # codes, networking (half-close, localhost, streaming upload), and CRLF/encoding
  # handling genuinely differ off Linux even though the Rust source is identical,
  # so Linux-only coverage misses them. The `v8` crate ships prebuilt static libs
  # for x86_64-pc-windows-msvc and aarch64-apple-darwin, so no source V8 build is
  # needed. `fail-fast: false` so one platform's failure still reports the others.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/tsr
      - run: tsr test
      # One platform is enough for the conformance suite — it checks the driver,
      # not platform semantics — and the binary is already built above.
      - if: matrix.os == 'ubuntu-latest'
        run: tsr conformance

  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/tsr
      - run: tsr miri
