[package]
name = "es-runtime-default-providers"
description = "Reference tokio-backed implementations of the ES-Runtime provider traits, plus deterministic test providers and a standalone driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
es-runtime-common.workspace = true
es-runtime-providers.workspace = true
es-runtime.workspace = true
dunce.workspace = true
futures-core.workspace = true
futures-util.workspace = true
getrandom.workspace = true
globset.workspace = true
walkdir.workspace = true
reqwest.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
webpki-roots.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "fs", "net", "io-util", "sync", "macros", "signal", "process"] }
tracing.workspace = true
url.workspace = true

# Safe (no `unsafe` in this crate) syscall wrappers, for sending a chosen signal
# to a child process — `Child::kill` can only ever send SIGKILL. Unix-only;
# already in the tree via tempfile, so no new crate in the graph.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
# Test-only: the async test harness and a current-thread runtime.
tokio = { workspace = true, features = ["rt", "time", "macros", "sync"] }
# Test-only: self-signed certs for the hermetic net-TLS round-trip test.
rcgen.workspace = true

[lints]
workspace = true
