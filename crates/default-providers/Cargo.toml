[package]
name = "es-runtime-default-providers"
description = "Reference tokio-backed implementations of the ES-Runtime provider traits, plus deterministic test providers and a standalone driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
es-runtime-common.workspace = true
es-runtime-providers.workspace = true
# Our own HTTP/1.1 and HTTP/2 (D217), server and client.
es-runtime-http.workspace = true
es-runtime.workspace = true
dunce.workspace = true
futures-core.workspace = true
futures-util.workspace = true
getrandom.workspace = true
globset.workspace = true
walkdir.workspace = true
hyper.workspace = true
async-compression.workspace = true
http-body-util.workspace = true
# The compat bridge between tokio IO and the futures-io the upgrade seam
# speaks (D55).
tokio-util = { workspace = true, features = ["compat", "io"] }
tokio-rustls.workspace = true
# `Proxy-Authorization: Basic` for an outbound proxy's credentials (D205).
base64.workspace = true
# The SHA-256 fingerprint of a verified peer certificate (D201). Already in the
# tree through `es-runtime`.
sha2.workspace = true
rustls.workspace = true
# `Sec-WebSocket-Accept` (RFC 6455 §4.2.2). Already in the tree for WebCrypto's
# SHA-1 (`es-runtime`), so no new crate.
sha1.workspace = true
webpki-roots.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "fs", "net", "io-util", "sync", "macros", "signal", "process"] }
# Socket options that must be set between `socket()` and `bind()` — `SO_REUSEPORT`
# for a TCP listener, and the reuse/TTL/multicast set for a UDP socket. Already
# in the tree (tokio), so no new crate in the graph (D7).
socket2 = { workspace = true }
tracing.workspace = true
turso_core.workspace = true
url.workspace = true

# Safe (no `unsafe` in this crate) syscall wrappers, for sending a chosen signal
# to a child process — `Child::kill` can only ever send SIGKILL. Unix-only;
# already in the tree via tempfile, so no new crate in the graph.

# `GetAdaptersAddresses`, for Windows' DNS servers (DECISIONS D188): raw API
# declarations with no build script, already in the tree through tokio and mio,
# so this adds no crate — only the features.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }
[target.'cfg(unix)'.dependencies]
# `termios` is `tcgetwinsize` — the terminal's real size, for a program drawing
# a progress line. `$COLUMNS` is not an answer: a shell exports it to itself
# rather than to a child, and it is stale the moment the window is dragged.
# `fs` is the `*at` family: the jail resolves a path and then acts on it
# relative to the descriptor of the directory it resolved in, so the name cannot
# be swapped between the two (crate::anchor).
rustix = { workspace = true, features = ["fs", "process", "termios"] }

[dev-dependencies]
# Never shipped: the `hyper` and `hyper-h1` rows of `examples/http_floor.rs`
# (hyper's own HTTP/1.1 server and its version-detecting builder, the measured
# baseline), and the HTTP/2 client the server tests drive ours with — an
# independent implementation.
hyper = { workspace = true, features = ["http1", "http2", "server", "client"] }
hyper-util = { workspace = true, features = ["tokio", "server-auto", "http1", "http2"] }
# Test-only: the async test harness and a current-thread runtime. `test-util`
# is the paused clock the body-deadline tests run on — the alternative is
# sleeping through a 30s grace in real time, once per case.
tokio = { workspace = true, features = ["rt", "time", "macros", "sync", "test-util"] }
# Never shipped: an independent WebSocket implementation for the tests to
# drive ours with (client and server), as hyper is for HTTP/2.
tokio-tungstenite = { workspace = true, features = ["connect"] }
# Test-only: self-signed certs for the hermetic net-TLS round-trip test.
rcgen.workspace = true
# Test-only: a capture layer, so a test can assert on what the servers logged.
tracing-subscriber.workspace = true
# Test-only: encoders for the HTTP client's decoding tests. Both already in the
# tree behind async-compression.
flate2 = "1.1"
brotli = "9.1"
# Test-only: scratch directories. Temp entries the guest asks for are made by
# the jail itself, by descriptor (crate::jail::anchor).
tempfile.workspace = true


[lints]
workspace = true

[features]
# Exposes the DNS message reader to the fuzz targets; not public API.
fuzzing = []
