[package]
name = "es-runtime"
description = "The driven runtime: op wiring, the tick/poll event loop, and timer scheduling, built on the engine abstraction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
es-runtime-common.workspace = true
es-runtime-engine.workspace = true
es-runtime-providers.workspace = true
futures-util = { workspace = true, features = ["alloc", "sink"] }
futures-channel = { workspace = true, features = ["std", "sink"] }
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
urlpattern.workspace = true
encoding_rs.workspace = true
regex.workspace = true
# WebCrypto (DECISIONS.md D9): RustCrypto, vetted constant-time primitives.
sha1.workspace = true
sha2.workspace = true
hmac.workspace = true
aes-gcm.workspace = true
aes.workspace = true
cbc.workspace = true
ctr.workspace = true
aes-kw.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
hkdf.workspace = true
pbkdf2.workspace = true
p256.workspace = true
p384.workspace = true
p521.workspace = true
rsa.workspace = true
sha1_rsa.workspace = true
# runtime:hashing (DECISIONS.md D57).
sha3.workspace = true
md-5.workspace = true
ripemd.workspace = true
blake3.workspace = true
twox-hash.workspace = true
crc32fast.workspace = true
crc32c.workspace = true
argon2.workspace = true
bcrypt.workspace = true
scrypt.workspace = true
subtle.workspace = true
base64 = "0.22"
flate2 = "1.1"
quick-xml = { version = "0.41.0", features = ["serialize"] }
serde_json.workspace = true
serde_yaml = "0.9.34"
toml = "0.8"
rmp-serde = "1.3.0"
serde = "1.0.228"
serde-transcode = "1.1.1"
brotli = "8"

[features]
# Exposes `crate::fuzz` for the targets under `fuzz/` (SPEC §5). Not public API
# and never enabled by a dependant — only the fuzz crate turns it on.
fuzzing = []

[lints]
workspace = true
