[package]
name = "es-runtime-dev-cli"
description = "esdev: the local development binary for the ES-Runtime — everything needed to get a service to production, and nothing that ships with it."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "esdev"
path = "src/main.rs"

[dependencies]
# The same plumbing `esrun` runs on. A program must behave identically under
# either binary, so nothing that shapes a run is reimplemented here.
es-runtime-cli-common.workspace = true
es-runtime-common.workspace = true
es-runtime-providers.workspace = true
tokio = { workspace = true, features = [
    "rt",
    "macros",
    # `--watch` supervises a child process, waits on it, and races that against
    # file events and ^C.
    "process",
    "signal",
    "time",
    "sync",
    # `--inspect` serves the debugger endpoint on a thread of its own.
    "net",
    "io-util",
] }
# `--inspect`. The WebSocket half of the Chrome DevTools Protocol endpoint —
# the same crate `runtime:ws` already uses, in its server role. Confined here for
# the same reason as everything else in this file: `esrun` has no debugger and
# must carry no code that could become one.
tokio-tungstenite.workspace = true
futures-util.workspace = true
# TypeScript/JSX type-stripping. Lives here and nowhere else: `esrun` runs
# JavaScript, and what turns a `.ts` into that runs on the developer's machine.
oxc.workspace = true
# `esdev build`. Same confinement as oxc: the production binary runs bundles, it
# does not make them.
rolldown.workspace = true
rolldown_common.workspace = true
# A source map a JS plugin hands back, parsed from the JSON every tool that
# makes one already has. Same pin and same graph as rolldown itself — this is
# the crate rolldown's own hook signatures name, not a second implementation.
rolldown_sourcemap.workspace = true
anyhow.workspace = true
# `--watch`. The events only; the restart policy is ours.
notify.workspace = true
# An `index.html` target: the script and link tags in it are the build's inputs,
# and the file esdev writes is the same one with those references pointing at
# what was built — spliced by byte span, so nothing else in it moves. Same
# confinement as oxc and rolldown.
html5gum.workspace = true
# `--install-types` — merging the type package into tsconfig.json. Moved here
# from `esrun` with the command itself (D59): a production binary has no reason
# to be able to rewrite a tsconfig.
serde_json.workspace = true

# Sending a child the signal that starts its graceful drain. The same crate and
# the same reason `default-providers` uses it for `runtime:system` — a typed
# `kill` without reaching for `libc`.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = [
    "process",
    # `--inspect` binds its port with SO_REUSEADDR, so a `--watch` restart can
    # take it back while the last debugger's connections are still in TIME_WAIT.
    "net",
] }

[dev-dependencies]
# The `--inspect` tests drive the real binary the way a debugger would: attach
# over the WebSocket, speak CDP, assert what comes back. Nothing new in the tree
# — the same crates the feature itself uses.
tokio = { workspace = true, features = ["rt", "macros", "net", "time", "io-util"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true

[lints]
workspace = true
