[package]
name = "es-runtime-cli"
description = "esrun: a standalone CLI that runs JavaScript files on the ES-Runtime with the default tokio providers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "esrun"
path = "src/main.rs"

[dependencies]
# The shared plumbing: prelude snapshot, permission-flag grammar, provider
# wiring, drive loop, graceful shutdown, error block. Everything that decides
# how a *run* behaves lives there so `esrun` and `esdev` cannot disagree.
es-runtime-cli-common.workspace = true
es-runtime-common.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
# `esrun upgrade` — self-update from GitHub releases.
self_update.workspace = true

[dev-dependencies]
# Test-only: a self-signed cert, so the telemetry e2e can stand up a TLS
# listener and fail a handshake against it hermetically.
rcgen.workspace = true

[lints]
workspace = true
