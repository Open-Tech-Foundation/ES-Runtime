# tasks.toml — the workspace-root anchor and task config for `tsr`.
#
# The runtime itself is Rust and builds with cargo; these tasks cover the
# JavaScript around it — the two driver packages and the pure-JS half of
# `runtime:serialization`. Each member keeps its own scripts in package.json,
# so a package can be built on its own; tsr is what runs them together.
#
#   tsr build          every JS package
#   tsr test:unit      the suites that need nothing running
#   tsr ci             lint + typecheck + build + unit tests
#
# Docs: https://tsr.opentechf.org/docs

[workspace]
members = ["packages/postgres", "packages/redis", "crates/runtime/js"]

# --- fan out to each package's own scripts ----------------------------------
# `delegate` runs the member's native script rather than restating the command
# here: the build of a package is a property of that package.

[tasks.build]
delegate = "bun"
packages = ["*"]

# Not "*": `crates/runtime/js` has 25 standing type errors (strict-null and
# symbol-index, in the Protobuf reflection layer) and has never been typechecked
# standalone — its tsconfig sets `types: []` and drives the editor, not a clean
# build. Adding it here would ship a task that is red on arrival, so the two
# packages that pass are the ones wired up. Fixing that backlog is its own change.
[tasks.typecheck]
delegate = "bun"
packages = ["@opentf/esrun-postgres", "@opentf/esrun-redis"]

# The full suites — the driver packages need a live PostgreSQL / Redis, and say
# so when they cannot reach one.
[tasks.test]
delegate = "bun"
packages = ["*"]

# The half that needs nothing running, which is what CI can always do.
[tasks."test:unit"]
delegate = "bun"
packages = ["*"]

# --- repo-wide, run once at the root ----------------------------------------
# Biome reads one config for the whole repo, so fanning these out would lint the
# same files once per package.

[tasks.lint]
run = "./node_modules/.bin/biome check"

[tasks.format]
run = "./node_modules/.bin/biome check --write"

[tasks.ci]
deps = ["lint", "typecheck", "build", "test:unit"]
