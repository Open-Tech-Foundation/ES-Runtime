# tasks.toml — the workspace-root anchor and task config for `tsr`.
#
# Every command CI runs is a task here, so what runs on a machine and what runs
# in a workflow cannot drift. CI installs tsr and calls `tsr <task>`; it does not
# spell out cargo or bun invocations of its own.
#
#   tsr --list          what there is
#   tsr ci              what a pull request must pass
#   tsr <task> --dry-run  print the command, run nothing
#
# Docs: https://tsr.opentechf.org/docs

[workspace]
members = ["packages/postgres", "packages/redis", "crates/runtime/js"]

# --- the runtime (Rust) ------------------------------------------------------

[tasks.fmt]
run = "cargo fmt --all --check"

# Build first so the `v8` crate fetches its prebuilt static lib: clippy runs in
# check mode, which does not trigger that download on a cold cache.
[tasks.clippy]
run = "cargo build --workspace --all-features && cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.test]
run = "cargo test --workspace --all-features"

# The curated suite, driven by the real binary: a real event loop, a real
# filesystem, real process exit. The grants are named rather than replaced by
# --allow-all deliberately — this suite runs the way a deployment does, so a new
# test that needs the network has to say so here.
[tasks.conformance]
run = "cargo run -p es-runtime-cli -- --allow-read --allow-write --allow-imports crates/runtime/conformance/run.js"

[tasks.miri]
run = "rustup toolchain install nightly --profile minimal --component miri && cargo +nightly miri test -p es-runtime-common -p es-runtime-providers"

[tasks.msrv]
run = "rustup toolchain install 1.95.0 --profile minimal && cargo +1.95.0 build --workspace --all-features"

# A script, not a `run` line: this needs a loop and ::group:: annotations, and
# tsr's mini-shell has no for-loops by design.
[tasks.fuzz]
run = "bash scripts/fuzz.sh"

[tasks.deny]
run = "cargo deny check"

# `deny.toml` allows exactly one copyleft crate — lightningcss, MPL-2.0 — and the
# exception is argued on the crate reaching `esdev` and nothing else. That
# argument is about the shape of a dependency graph, which `cargo deny` has no
# way to assert, so it is asserted here: if MPL-2.0 code ever turns up in what a
# service deploys, this fails rather than the reasoning silently going stale.
[tasks.copyleft-stays-out-of-esrun]
run = "bash scripts/copyleft-confined.sh"

[tasks.audit]
run = "cargo audit"

# --- the JavaScript ----------------------------------------------------------

[tasks.install]
run = "bun install --frozen-lockfile"

# `packages` auto-detects each member's native runner, so this is the one script
# left in their package.json — `npm publish` needs it, and nothing else does.
[tasks.build]
packages = ["*"]
parallel = true

# Not "*": `crates/runtime/js` has 25 standing type errors and has never been
# typechecked standalone (its tsconfig sets `types: []` and drives the editor).
# Wiring it up would ship a task red on arrival. Matched by manifest name, which
# is the other thing `packages` accepts.
[tasks.typecheck]
run = "tsc --noEmit"
packages = ["@opentf/esrun-postgres", "@opentf/esrun-redis"]
parallel = true

[tasks.lint]
run = "biome check"

[tasks.format]
run = "biome check --write"

# Biome's CI mode: no writes, and it reports rather than fixes.
[tasks."lint:ci"]
run = "biome ci"

# --- test suites -------------------------------------------------------------

# The protocol halves, which need nothing running.
[tasks."test:protocol"]
run = "./test/unit/run.sh"
packages = ["@opentf/esrun-postgres", "@opentf/esrun-redis"]
parallel = true

[tasks."test:serialization"]
run = "bun test"
dir = "crates/runtime/js"

[tasks."test:unit"]
deps = ["test:protocol", "test:serialization"]

# The full driver suites — these need a live server, and say so when they cannot
# reach one. One task each rather than a fan-out, because CI gives each its own
# job with its own service containers.
[tasks."test:postgres"]
run = "./test/run.sh"
dir = "packages/postgres"

[tasks."test:redis"]
run = "./test/run.sh"
dir = "packages/redis"

[tasks."test:drivers"]
deps = ["test:postgres", "test:redis"]

# The debug binary the driver suites run against (ESRUN points at it). Debug,
# not release: these check behaviour rather than speed.
[tasks."build:esrun"]
run = "cargo build -p es-runtime-cli"

# --- aggregates --------------------------------------------------------------

# Sequential by design: test:unit reads what build wrote.
[tasks.ci]
deps = ["lint", "typecheck", "build", "test:unit"]
