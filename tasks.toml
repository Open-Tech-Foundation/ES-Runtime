# tasks.toml — the workspace-root anchor and task config for `tsr`.
#
# Every command CI runs is a task here, so what runs on a machine and what runs
# in a workflow cannot drift. CI installs tsr and calls `tsr <task>`; it does not
# spell out cargo or pnpm invocations of its own.
#
#   tsr --list          what there is
#   tsr ci              what a pull request must pass
#   tsr <task> --dry-run  print the command, run nothing
#
# Docs: https://tsr.opentechf.org/docs

[workspace]
members = ["packages/postgres", "packages/mysql", "packages/redis", "packages/types", "crates/runtime/js", "crates/dev-cli/js", "website", "bench"]

# --- the runtime (Rust) ------------------------------------------------------

[tasks.fmt]
run = "cargo fmt --all --check"

# Build first so the `v8` crate fetches its prebuilt static lib: clippy runs in
# check mode, which does not trigger that download on a cold cache.
[tasks.clippy]
run = "cargo build --workspace --all-features && cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.test]
# `--no-fail-fast`: cargo otherwise stops at the first test *target* that
# fails, so a platform with problems in several binaries reports them one
# run at a time — fix, push, wait, discover the next. The matrix already
# says `fail-fast: false` for the same reason one leg should not hide the
# others; this is that rule one level down.
run = "cargo test --workspace --all-features --no-fail-fast"

# esdev's suite again with the V8 inspector compiled in (DECISIONS D59), as the
# released esdev is built: `--inspect` and `--coverage` only work there, and
# their tests otherwise only check the refusal. `-p es-runtime-dev-cli` alone,
# because the variable must never reach an esrun build.
[tasks."test:inspector"]
run = "cargo test -p es-runtime-dev-cli --no-fail-fast"
env = { ES_RUNTIME_INSPECTOR = "1" }

# `esdev test --browser` in a real browser: every test in esdev's suite whose
# name says browser, the stub-machine ones included. `ESDEV_TEST_BROWSER` names
# the browser; set, a browser that cannot be driven fails the run instead of
# passing as a skip, which is how CI's browser job runs it once per browser.
[tasks."test:browser"]
run = "cargo test -p es-runtime-dev-cli --test cli browser --no-fail-fast"

# The curated suite, driven by the real binary: a real event loop, a real
# filesystem, real process exit. The grants are named rather than replaced by
# --allow-all deliberately — this suite runs the way a deployment does, so a new
# test that needs the network has to say so here.
[tasks.conformance]
run = "cargo run -p es-runtime-cli -- --allow-read --allow-write --allow-imports crates/runtime/conformance/run.js"

[tasks.miri]
run = "rustup toolchain install nightly --profile minimal --component miri && cargo +nightly miri test -p es-runtime-common -p es-runtime-providers"

[tasks.msrv]
run = "rustup toolchain install 1.96.0 --profile minimal && cargo +1.96.0 build --workspace --all-features"

# A script, not a `run` line: this needs a loop and ::group:: annotations, and
# tsr's mini-shell has no for-loops by design.
[tasks.fuzz]
run = "bash scripts/fuzz.sh"

[tasks.deny]
run = "cargo deny check"

# `cargo deny` checks *which* licences are in the graph; this checks **where**.
# An exception for a copyleft crate is normally argued on it reaching `esdev`
# and never the binary a service deploys — a claim about the shape of a
# dependency graph that one moved line can quietly falsify. There are no
# exceptions today (D67), and the gate is kept so the next one has to hold.
[tasks.copyleft-stays-out-of-esrun]
run = "bash scripts/copyleft-confined.sh"

[tasks.audit]
run = "cargo audit"

# --- the JavaScript ----------------------------------------------------------

[tasks.install]
run = "pnpm install --frozen-lockfile"

# Keep the package manager explicit here. tsr's `packages` shorthand discovers
# a package runner independently of this workspace and can select npm; these
# filters make every task run through the repository's pnpm workspace instead.
# The build scripts remain in package.json because `npm publish` needs them.
#
# Named rather than "*": `@opentf/esrun-types` is a workspace member (it is
# typechecked) and has nothing to build — it ships the `.d.ts` files as they are
# written. A broad pnpm filter would run `build` there and fail on the missing
# script, so the alternative is a no-op script that exists to be skipped, which
# is a worse thing to leave in a published manifest.
[tasks.build]
run = "pnpm --filter @opentf/esrun-postgres --filter @opentf/esrun-mysql --filter @opentf/esrun-redis --filter esrun-serialization --filter esdev-dom-color --parallel run build"

# Not "*": `crates/runtime/js` has 25 standing type errors and has never been
# typechecked standalone (its tsconfig sets `types: []` and drives the editor).
# Wiring it up would ship a task red on arrival. The pnpm filters match the
# packages by manifest name.
#
# `@opentf/esrun-types` is here for a different reason from the other two. It
# describes a surface it does not implement, so nothing else can catch it being
# wrong — the runtime's suite proves the code works and would go on passing
# while the types beside it said something else. Its tsconfig sets
# `skipLibCheck: false`, which is what makes the declarations themselves the
# thing being checked, and `test/` holds the `@ts-expect-error` cases that fail
# when a declaration quietly widens to `any`.
[tasks.typecheck]
run = "pnpm --filter @opentf/esrun-postgres --filter @opentf/esrun-mysql --filter @opentf/esrun-redis --filter @opentf/esrun-types --parallel exec tsc --noEmit"

[tasks.lint]
run = "biome check"

[tasks.format]
run = "biome check --write"

# Biome's CI mode: no writes, and it reports rather than fixes.
[tasks."lint:ci"]
run = "biome ci"

# --- test suites -------------------------------------------------------------

# The protocol halves, which need nothing running.
#
# Named rather than "*": the drivers are the only members that own a
# `test/unit/run.sh`. A broad pnpm filter would reach for one in
# `@opentf/esrun-types` and `esrun-serialization` too, and a member with no
# such file fails the task rather than being passed over.
[tasks."test:protocol"]
run = "pnpm --filter @opentf/esrun-postgres --filter @opentf/esrun-mysql --filter @opentf/esrun-redis --parallel exec bash ./test/unit/run.sh"

# Run with our own `esdev`, not another JavaScript runtime — the same reasoning as `build` above. This
# is the runtime's largest hand-written JS subsystem, and running it on the
# binary we ship means the suite exercises the module loader, the TypeScript
# stripping and the event loop a deployment actually gets, rather than another
# runtime's versions of all three.
#
# `target/release` goes on PATH ahead of everything so a locally built `esdev`
# wins over an installed one — the runner has to be exercisable before it is
# released, and with PATH alone a contributor who just built their change would
# still be testing against the last release. Relative to `dir`, which is where
# the command runs. CI has no such build and picks up the released binary.
[tasks."test:serialization"]
run = "esdev test"
dir = "crates/runtime/js"
env = { PATH = "../../../target/release:${PATH}" }

# The upstream WPT slice for the test-only DOM: `dom`, `custom-elements` and
# `shadow-dom`, run unmodified under `esdev test --dom`. Fails on any subtest
# that regresses against `wpt/dom-expectations.json`. Needs `wpt/fetch.sh`
# first, so it is not yet a `ci` dependency: the checkout is gitignored.
[tasks."test:dom-wpt"]
run = "cargo build -p es-runtime-dev-cli && deno run --allow-read --allow-run --allow-write wpt/dom-run.js"

# The test-only DOM's own unit tests, one file per module it has them for. They
# import the module factories directly, so they check tree, event and parsing
# behaviour without going through a whole `esdev test --dom` process the way
# `crates/dev-cli/tests/cli.rs` does. Run on our own binary, and on PATH the
# same way `test:serialization` is, for the same reason.
[tasks."test:dom-unit"]
run = "esdev test"
dir = "crates/dev-cli/src/dom"
env = { PATH = "../../../../target/release:${PATH}" }

# A portable baseline for the test-only DOM: the same cases under headless
# Chrome, esdev, jsdom and happy-dom. `--strict` because the recorded run has no
# gaps left — a new difference from Chrome, or drift in any column, should fail
# rather than be printed. Needs Chrome and the npm emulators, so it is not a
# `ci` dependency.
[tasks."test:dom-matrix"]
run = "cargo build -p es-runtime-dev-cli && deno test --config=wpt/dom-matrix/deno.json wpt/dom-matrix/cases_test.js && deno run --allow-env --allow-net --allow-read --allow-run --allow-sys --allow-write --config=wpt/dom-matrix/deno.json wpt/dom-matrix/css-table.js --check && deno run --allow-env --allow-net --allow-read --allow-run --allow-sys --allow-write --config=wpt/dom-matrix/deno.json wpt/dom-matrix/run.js --strict"

# One upstream WPT file, in Chrome. Triage rather than a gate: a subtest Chrome
# fails too is upstream ahead of the browsers, and is recorded as an expectation
# instead of fixed. Takes the path under `wpt/upstream/`.
[tasks."test:dom-wpt-chrome"]
run = "deno run --allow-env --allow-net --allow-read --allow-run --allow-sys --allow-write --config=wpt/dom-matrix/deno.json wpt/chrome-run.js"

# The CSS value table the DOM validates against, read out of Chrome: which kinds
# of value each of the 436 properties takes, and what a bare `0` serializes as.
# Generated rather than hand-written, because every hand-written version of it
# was wrong about something (`cx` took a number, `transition-duration` did not).
# `--check` re-asks Chrome and fails if the committed table has drifted, which is
# what `test:dom-matrix` runs.
[tasks."gen:css-table"]
run = "deno run --allow-env --allow-net --allow-read --allow-run --allow-sys --allow-write --config=wpt/dom-matrix/deno.json wpt/dom-matrix/css-table.js"

# The surface next to the behaviour: 192 interfaces, members and behaviours put
# to all four runtimes. A difference from Chrome here is usually a stated
# non-goal — a layout API has no answer without layout — so what it gates on is
# drift from the recorded run, not agreement.
[tasks."test:dom-surface"]
run = "cargo build -p es-runtime-dev-cli && deno run --allow-env --allow-net --allow-read --allow-run --allow-sys --allow-write --config=wpt/dom-matrix/deno.json wpt/dom-matrix/surface-run.js --strict"

# The published parity documents, generated from the two recorded baselines and
# nothing else: no Chrome, no network, so `ci` can check they are current.
[tasks."docs:parity"]
run = "deno run --allow-read --allow-write wpt/dom-matrix/parity-doc.js"

[tasks."docs:parity-check"]
run = "deno run --allow-read wpt/dom-matrix/parity-doc.js --check"

# Everything that measures the test-only DOM. Needs Chrome, the npm emulators
# and `wpt/fetch.sh`, so it is a task of its own rather than a `ci` dependency:
# the workflow job that has them calls this one.
[tasks."test:dom"]
deps = ["test:dom-unit", "test:dom-wpt", "test:dom-matrix", "test:dom-surface"]

[tasks."test:unit"]
deps = ["test:protocol", "test:serialization", "test:dom-unit"]

# The full driver suites — these need a live server, and say so when they cannot
# reach one. One task each rather than a fan-out, because CI gives each its own
# job with its own service containers.
[tasks."test:postgres"]
run = "./test/run.sh"
dir = "packages/postgres"

[tasks."test:mysql"]
run = "./test/run.sh"
dir = "packages/mysql"

[tasks."test:redis"]
run = "./test/run.sh"
dir = "packages/redis"

[tasks."test:drivers"]
deps = ["test:postgres", "test:mysql", "test:redis"]

# The debug binary the driver suites run against (ESRUN points at it). Debug,
# not release: these check behaviour rather than speed.
[tasks."build:esrun"]
run = "cargo build -p es-runtime-cli"

# The esdev artifact with the debugger compiled in (DECISIONS D59). The V8
# inspector is a compile-time opt-in read from the environment, and it must
# never be set for an esrun build — hence its own task carrying the variable
# rather than a flag, so the two cannot mix.
[tasks."build:esdev"]
run = "cargo build --release -p es-runtime-dev-cli"
env = { ES_RUNTIME_INSPECTOR = "1" }

# --- the website -------------------------------------------------------------

# The site is a workspace member, while this task remains deliberately focused:
# it is long-lived and serves until interrupted.
[tasks."dev:website"]
run = "otfw dev"
dir = "website"

# Re-reads the two binaries' versions out of Cargo.toml into the module the site
# imports. Run it after a version bump: nothing else notices that the navbar
# badge and the install page have fallen behind the tags.
[tasks.versions]
run = "bun scripts/site-versions.mjs"

# --- aggregates --------------------------------------------------------------

# Sequential by design: test:unit reads what build wrote.
[tasks.ci]
deps = ["lint", "typecheck", "build", "test:unit", "docs:parity-check"]
