# tasks.toml — the workspace-root anchor and task config for `tsr`.
#
# The runtime itself is Rust and builds with cargo; these tasks cover the
# JavaScript around it — the two database drivers and the pure-JS half of
# `runtime:serialization`. Each member keeps its own scripts in package.json, so
# a package still builds on its own; tsr is what runs them together.
#
#   tsr build          every JS package
#   tsr test:unit      the suites that need nothing running
#   tsr ci             lint + typecheck + build + unit tests
#
# Docs: https://tsr.opentechf.org/docs

[workspace]
members = ["packages/postgres", "packages/redis", "crates/runtime/js"]

# --- fan out to each package's own scripts ----------------------------------
# `packages` auto-detects each member's native runner, so the command lives in
# that package's package.json: what a package builds is a property of it.
# These three fan out over independent packages, so they run in parallel.

[tasks.build]
packages = ["*"]
parallel = true

# Not "*": `crates/runtime/js` has 25 standing type errors (strict-null and
# symbol-index, in the Protobuf reflection layer) and has never been typechecked
# standalone — its tsconfig sets `types: []` and drives the editor, not a clean
# build. Adding it would ship a task red on arrival. Matched by manifest name
# rather than path, which is the other thing `packages` accepts.
[tasks.typecheck]
packages = ["@opentf/esrun-postgres", "@opentf/esrun-redis"]
parallel = true

# The full suites — the driver packages need a live PostgreSQL / Redis, and say
# so when they cannot reach one. Serial: they are the noisy ones, and a failure
# is easier to read when its output is not interleaved.
[tasks.test]
packages = ["*"]

# The half that needs nothing running, which is what CI can always do.
[tasks."test:unit"]
packages = ["*"]
parallel = true

# --- repo-wide, run once at the root ----------------------------------------
# Biome reads one config for the whole repo, so fanning these out would lint the
# same files once per package. `node_modules/.bin` is on PATH already — tsr
# prepends it, walking up from the task directory to the workspace root.

[tasks.lint]
run = "biome check"

[tasks.format]
run = "biome check --write"

# Sequential by design: `test:unit` reads what `build` wrote.
[tasks.ci]
deps = ["lint", "typecheck", "build", "test:unit"]
