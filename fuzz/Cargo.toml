# Fuzz targets for ES-Runtime (SPEC §5).
#
# Its own workspace: `cargo fuzz` builds with `-Z sanitizer=address` on nightly,
# which the main workspace neither pins nor needs. Run one with
#
#     cargo +nightly fuzz run <target> -- -max_total_time=60
#
# The targets reach the runtime's parsers through `es-runtime`'s `fuzzing`
# feature, which exists for exactly this and is not public API.
[package]
name = "es-runtime-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.es-runtime]
path = "../crates/runtime"
features = ["fuzzing"]

[dependencies.es-runtime-json]
path = "../crates/json"

[dependencies.es-runtime-default-providers]
path = "../crates/default-providers"
features = ["fuzzing"]

# Not used here. turso_core takes `branches` without `std`, and on a nightly
# compiler that makes its `abort()` call `core::intrinsics::abort`, which
# nightly removed (2026-10-27) — so every fuzz build failed before fuzzing.
# Turning `std` on here makes it call `std::process::abort()` instead. Only
# this crate builds on nightly; the shipped binaries build on stable, where
# `branches` never reaches for the intrinsic.
[dependencies.branches]
version = "0.4"
default-features = false
features = ["std"]

# Fuzzing is pointless without optimization, and a panic must abort so libFuzzer
# sees it as a crash rather than an unwind that the harness swallows.
[profile.release]
debug = 1

[workspace]

[[bin]]
name = "url"
path = "fuzz_targets/url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encoding"
