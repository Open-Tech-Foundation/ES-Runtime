# cargo-deny config — supply-chain CI gate (ARCHITECTURE.md §7, SPEC.md §5).
# Run as `cargo deny check`. Covers advisories, licenses, bans, and sources.

[advisories]
# RustSec advisory DB. Unmaintained/unsound advisories are surfaced; a known
# exception must be listed explicitly here rather than silenced globally.
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained (informational advisory, not a vulnerability) and
    # has no safe upgrade. It reaches us only transitively through the `v8`
    # crate (es-runtime-engine → v8 → paste); we do not depend on it directly
    # and cannot drop it without v8 doing so upstream. Re-evaluate when v8
    # removes the dependency.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained-only, transitive via the v8 crate, no fix available" },
    # `rsa` — "Marvin Attack" timing sidechannel (RUSTSEC-2023-0071, medium).
    # Backs `crypto.subtle` RSA (DECISIONS.md D9). No fixed upgrade exists; the
    # flaw is architectural in RustCrypto's RSA. Accepted (maintainer, 2026-06-12)
    # as a documented security gap: RSA private-key ops are host-side (no guest
    # timing oracle), and the alternatives (aws-lc-rs — ambient RNG + C backend;
    # openssl-rs — system dependency) cost more than they buy. Mirrored in
    # `.cargo/audit.toml`; revisit per SECURITY.md / D9.
    { id = "RUSTSEC-2023-0071", reason = "Marvin timing sidechannel; no fix available; host-side RSA keys; documented gap (D9/SECURITY.md)" },
]

[licenses]
# Project ships under Apache-2.0 (DECISIONS.md D10, Locked). Dependencies must
# carry an OSI-approved permissive license compatible with that. Copyleft and
# unknown licenses fail the gate; add a deliberate exception below if ever needed.
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    # Permissive *data* license — covers the rustls root-certificate bundle
    # (webpki-root-certs), pulled in transitively via reqwest's TLS (D20).
    "CDLA-Permissive-2.0",
]
# Per-crate exceptions. Named one by one rather than added to `allow` above, so
# a *new* dependency under one of these licenses still fails the gate: what is
# permitted here is these four crates, not this license.
#
# **MPL-2.0 — Servo's CSS selector machinery, reached through `lol-html`**
# (DECISIONS D61), which is how `esdev` reads an `index.html` for the script and
# link tags that name a build's inputs and writes it back pointing at what was
# built. Three things make this a deliberate yes rather than a slippery one:
#
#  * MPL-2.0 is **file-level** copyleft. Its reciprocity covers modifications to
#    the covered files themselves; §3.3 expressly permits combining them into a
#    Larger Work under another license. These crates are used unmodified, so the
#    obligation is attribution and pointing at their source — recorded in NOTICE
#    — and nothing propagates to ES-Runtime's own Apache-2.0 code.
#  * They are in **`dev-cli` only**. Neither the library crates, nor `esrun`,
#    nor anything an embedder links carries them; the graph is checked by the
#    crate layout, not by intention (D11).
#  * There is no permissive substitute that keeps the property that matters: a
#    rewriter that leaves every byte it did not touch exactly as the author
#    wrote it. Parsing to a DOM and re-serialising would reformat quotes,
#    entities and self-closing tags in a file the developer owns.
[[licenses.exceptions]]
name = "cssparser"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "cssparser-macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "selectors"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "dtoa-short"
allow = ["MPL-2.0"]

[bans]
# Surface duplicate versions (bloat / audit-surface) without failing the build
# yet; tighten to "deny" once the graph stabilizes.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io for now; no git or alternate registries until explicitly added.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
