# cargo-deny config — supply-chain CI gate (ARCHITECTURE.md §7, SPEC.md §5).
# Run as `cargo deny check`. Covers advisories, licenses, bans, and sources.

[advisories]
# RustSec advisory DB. Unmaintained/unsound advisories are surfaced; a known
# exception must be listed explicitly here rather than silenced globally.
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained (informational advisory, not a vulnerability) and
    # has no safe upgrade. It reaches us only transitively through the `v8`
    # crate (es-runtime-engine → v8 → paste); we do not depend on it directly
    # and cannot drop it without v8 doing so upstream. Re-evaluate when v8
    # removes the dependency.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained-only, transitive via the v8 crate, no fix available" },
    # `rsa` — "Marvin Attack" timing sidechannel (RUSTSEC-2023-0071, medium).
    # Backs `crypto.subtle` RSA (DECISIONS.md D9). No fixed upgrade exists; the
    # flaw is architectural in RustCrypto's RSA. Accepted (maintainer, 2026-06-12)
    # as a documented security gap: RSA private-key ops are host-side (no guest
    # timing oracle), and the alternatives (aws-lc-rs — ambient RNG + C backend;
    # openssl-rs — system dependency) cost more than they buy. Mirrored in
    # `.cargo/audit.toml`; revisit per SECURITY.md / D9.
    { id = "RUSTSEC-2023-0071", reason = "Marvin timing sidechannel; no fix available; host-side RSA keys; documented gap (D9/SECURITY.md)" },
]

[licenses]
# Project ships under Apache-2.0 (DECISIONS.md D10, Locked). Dependencies must
# carry an OSI-approved permissive license compatible with that. Copyleft and
# unknown licenses fail the gate; add a deliberate exception below if ever needed.
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    # Permissive *data* license — covers the rustls root-certificate bundle
    # (webpki-root-certs), pulled in transitively via reqwest's TLS (D20).
    "CDLA-Permissive-2.0",
    # The Boost Software License, not the Business Source License that shares the
    # abbreviation: OSI-approved, permissive, and without even a
    # binary-attribution requirement. Reached via lightningcss (xxhash-rust).
    "BSL-1.0",
]
exceptions = [
    # The CSS pipeline in `esdev` (stylesheet `@import` bundling, minification
    # and syntax lowering for an `index.html` target) is MPL-2.0, and with it the
    # CSS-parsing subtree it is built on — Mozilla's own `cssparser` lineage, by
    # way of Servo. These are the only copyleft crates in the tree, and they are
    # allowed deliberately, on three grounds:
    #
    # 1. MPL-2.0's copyleft is **per-file**: it governs these crates' own
    #    sources and does not reach a work that merely links them. Apache-2.0
    #    output is unaffected, which is what D10 protects.
    # 2. It is linked **only into `esdev`**, the binary a developer runs to
    #    produce an artifact — never into `esrun`, which is what a service
    #    deploys. Only `crates/dev-cli` takes the workspace dependency, and the
    #    `copyleft-stays-out-of-esrun` task asserts it stays that way, because
    #    ground 1 is the kind of reasoning that quietly stops applying when a
    #    crate moves.
    # 3. They are unmodified and used through their public APIs, so the
    #    obligation the license does create — publish changes to those files — is
    #    one there is nothing to discharge for.
    #
    # Listed crate by crate rather than as a blanket `allow = ["MPL-2.0"]`: a new
    # copyleft dependency should have to be added here on purpose, which is the
    # whole value of the gate. `cargo deny` names any crate that is missing.
    { allow = ["MPL-2.0"], crate = "lightningcss" },
    # lightningcss's own derive macro. A proc-macro, so it runs during the build
    # and contributes no code to any binary at all.
    { allow = ["MPL-2.0"], crate = "lightningcss-derive" },
    # The CSS parser lightningcss is built on, and its pieces: Mozilla's
    # `cssparser`, the selector engine Servo and Parcel share, and two small
    # helpers pulled along with them.
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-color" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "parcel_selectors" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
]

[bans]
# Surface duplicate versions (bloat / audit-surface) without failing the build
# yet; tighten to "deny" once the graph stabilizes.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io for now; no git or alternate registries until explicitly added.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
