# Virtual workspace root for ES-Runtime.
#
# Crate layout and dependency direction are fixed by ARCHITECTURE.md §2 / DECISIONS.md D11:
#
#   common → engine → providers → runtime → default-providers → cli-common → {runtime-cli, dev-cli}
#
# Each crate may depend only on crates to its left. The `v8` crate appears *only*
# in `engine`; real I/O appears *only* in `default-providers`. Phase 1 introduces
# `common` and `engine`; the remaining crates are added in their own phases
# (SPEC.md §6) to keep merged code free of stubs.
[workspace]
resolver = "3"
members = [
    "crates/common",
    "crates/engine",
    "crates/providers",
    "crates/runtime",
    "crates/default-providers",
    "crates/cli-common",
    "crates/runtime-cli",
    "crates/dev-cli",
]

# Shared package metadata. Individual crates inherit via `field.workspace = true`.
# Versioning starts at 0.1.0 (DECISIONS D24): semver from here, 0.x allows
# breaking changes but each is deliberate and changelogged; the public API
# (engine `Engine`/`Value`, `Runtime`, provider traits) and the `runtime:`
# standard-module namespace are the versioned contract.
[workspace.package]
version = "0.24.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/Open-Tech-Foundation/ES-Runtime"
authors = ["Open Tech Foundation <https://opentechf.org> and its contributors"]

# Single source of truth for dependency versions. Pinned per DECISIONS.md D7
# (supply chain) / ARCHITECTURE.md §7; bumped deliberately, not floated.
[workspace.dependencies]
# Error model (DECISIONS.md D12).
thiserror = "2.0.18"
# Observability (ARCHITECTURE.md §8): structured spans, no println!.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# V8 bindings (DECISIONS.md D2). Confined to the `engine` crate.
v8 = "150.0.0"
# Async runtime + OS CSPRNG, used only by `default-providers` (DECISIONS.md D5).
tokio = "1.52.3"
getrandom = "0.4.2"
# The WHATWG Encoding Standard: the label table and every decoder `TextDecoder`
# accepts. The same implementation Firefox ships, so the legacy encodings are
# the spec's tables rather than a hand-written subset.
encoding_rs = "0.8.35"
# Unpredictable temp file/directory names for `runtime:fs`. Already in the tree
# (via self_update); named here so the dependency is deliberate rather than
# inherited. Confined to `default-providers`.
tempfile = "3.27.0"
# The embedded SQL engine behind `runtime:db`'s `sqlite:` scheme (DECISIONS.md
# D56). `turso_core` rather than the `turso` wrapper: the wrapper pulls mimalloc
# and a full-text index we do not use, and cannot be handed a custom VFS.
#
# `fs` is on, and not by choice — the crate's own vacuum path calls an
# `fs`-gated constructor, so building without it fails upstream rather than
# trimming anything. It costs the external-VFS module loader, which nothing here
# calls. What matters is that it does *not* choose the engine's I/O for us:
# `Database::open` takes the `IO` we hand it, and ours resolves every path
# through the same jail `runtime:fs` uses. `series` and `percentile` (extra SQL
# functions, neither in SQLite core) are dropped and can return when asked for.
#
# Pinned at a pre-release deliberately (D56): it is the only reliable Rust
# implementation, and the `sqlite:` scheme keeps the choice swappable.
turso_core = { version = "0.8.0-pre.3", default-features = false, features = ["fs", "encryption", "json", "uuid", "time"] }
# WHATWG URL parsing, used by `runtime` for the URL family (DECISIONS.md D17).
url = "2.5.8"
# URLPattern, used by `runtime` for the URLPattern global. Same reasoning as
# `url`: the standard's parser is large and exacting, so it is delegated to a
# maintained implementation rather than reimplemented in the JS prelude.
urlpattern = "0.6.0"
# The RegExp backend URLPattern compiles its components to. Confined to
# `runtime`; already present transitively via `urlpattern`, so no new crate.
regex = "1.13.1"
# package.json parsing for node_modules resolution (DECISIONS.md D22). Confined
# to `default-providers`; already present transitively, so no new crate.
serde = "1.0.228"
serde_json = "1.0.150"
# Safe syscall wrappers (`kill`) for the child-process provider (DECISIONS D37).
# Chosen over `libc` because `default-providers` forbids `unsafe`. Already in the
# tree transitively (tempfile), so it adds no crate to the graph.
rustix = { version = "1.1.4", default-features = false }
# Socket options that must be set *before* bind — `SO_REUSEPORT`, which is how
# several processes share one listening port and let the kernel balance across
# them. `TcpListener::bind` gives no hook for that, so the listener is built by
# hand when it is asked for. Already in the tree (tokio/hyper depend on it), so
# it adds no crate to the graph. Confined to `default-providers`.
socket2 = "0.6.5"
# Cross-OS path canonicalization (DECISIONS.md D25): strips the Windows `\\?\`
# verbatim prefix that breaks file: URL conversion. Confined to
# `default-providers`; already present transitively, so no new crate.
dunce = "1.0.5"
# Async byte-stream trait for provider bodies (trait-only, tiny).
futures-core = "0.3.32"
# Runtime-agnostic mpsc channel (no tokio) — backs the streaming `fetch` request
# body: JS pushes chunks into a bounded sender, the transport drains the receiver
# as a `ByteStream`. Bounded capacity gives upload backpressure.
futures-channel = { version = "0.3.32", default-features = false, features = ["alloc"] }
# Vetted HTTP client for the default NetTransport (DECISIONS.md D20). rustls TLS
# only (no OpenSSL/native-tls). Confined to `default-providers`.
#
# The three content-codings are the same set `CompressionStream` implements
# (SPEC §2.8), which is what Fetch's "decode" step needs a client to understand;
# enabling them is what makes reqwest negotiate `Accept-Encoding` and decode the
# response body. `zstd` is deliberately left out: the runtime does not implement
# it anywhere else, and advertising a coding we would then have to decode with a
# codec present for no other reason is dependency for its own sake.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "http2", "charset", "gzip", "brotli", "deflate"] }
futures-io = { version = "0.3.32", default-features = false, features = ["std"] }
futures-util = { version = "0.3.32", default-features = false }
# Vetted HTTP/1.1 + HTTP/2 server for the default HttpServerProvider
# (runtime:http). The same hyper 1.x already in the tree via reqwest;
# hyper-util's tokio executor + http-body-util's Full body keep it minimal. All
# MIT. Confined to `default-providers`.
#
# `http2` adds no crate to the graph: the `h2` implementation behind it is
# already present via reqwest's client-side HTTP/2. hyper-util's `server-auto`
# is what lets one accepted connection serve either version — it reads the
# HTTP/2 connection preface and dispatches, so h2 over ALPN and cleartext h2c
# (prior knowledge) both work without a second accept path.
hyper = { version = "1.10.1", default-features = false, features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio", "server-auto"] }
http-body-util = "0.1.3"
# TLS for `runtime:net` client sockets (`secureTransport: "on"`, DECISIONS D28).
# rustls via tokio-rustls with the `aws-lc-rs` provider (selected explicitly —
# both ring and aws-lc-rs are in the tree, so the process default is ambiguous);
# trust anchors from the bundled Mozilla set (webpki-roots, no platform I/O).
# Both already present transitively via reqwest. Confined to `default-providers`.
tokio-util = { version = "0.7.18", default-features = false }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws-lc-rs", "tls12"] }
webpki-roots = "1.0.7"
# RFC 6455 WebSocket framing for the `WebSocket` global (DECISIONS D29). TLS is
# done by us (tokio-rustls, above) and the established stream handed to
# `client_async`, so no TLS feature is pulled here. Confined to default-providers.
tokio-tungstenite = { version = "0.26.2", default-features = false, features = ["handshake"] }
# Dev-only: self-signed certs for the hermetic net-TLS test.
rcgen = "0.14"
bytes = "1.11.1"
# WebCrypto backend: the RustCrypto suite (DECISIONS.md D9). Used by `runtime`.
# Two version generations coexist intentionally: `aes-gcm` 0.10 (+ `aes` 0.8,
# `cbc`, `ctr`) sit on `cipher` 0.4, while the hashing/KDF crates (`sha2`,
# `hmac`, `hkdf`, `pbkdf2`) sit on `digest` 0.11 — `aes-gcm` 0.11 is still an
# rc, so we don't float onto it. `cbc`/`ctr` are pinned to the 0.1/0.9 line so
# they reuse the same `aes` 0.8 / `cipher` 0.4 that `aes-gcm` already pulls (no
# duplicate `aes`); `hkdf`/`pbkdf2` 0.13 reuse `hmac` 0.13 + `sha2`.
sha1 = "0.11.0"
sha2 = "0.11.0"
hmac = "0.13.0"
aes-gcm = "0.10.3"
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc"] }
ctr = "0.9.2"
# AES-KW (NIST SP 800-38F / RFC 3394), the key-wrapping algorithm
# `subtle.wrapKey`/`unwrapKey` accept alongside AES-GCM/CBC/CTR and RSA-OAEP.
# Pinned to the 0.2 line for the same reason as `cbc`/`ctr`: it reuses the
# `aes` 0.8 / `cipher` 0.4 already in the tree, where 0.3 would pull a third
# `aes` generation (0.9 / `cipher` 0.5) in alongside.
aes-kw = { version = "0.2.1", features = ["alloc"] }
# Curve25519 for the WebCrypto Secure Curves algorithms, Ed25519 and X25519.
# Both sit on `sha2` 0.11 — the same generation the rest of the hashing stack
# uses — so they add a curve, not a second hash tree. `static_secrets` gives
# X25519 a secret that can be kept and reused across derivations, which is what
# a stored `CryptoKey` is; without it only ephemeral secrets exist. Neither
# needs an RNG feature: keys are built from Entropy-provider bytes (D9), and
# Ed25519 signing is deterministic (RFC 8032).
ed25519-dalek = "3.0.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
hkdf = "0.13.0"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
# Elliptic curves for ECDSA/ECDH (SPEC §2.10). These sit on the older
# `elliptic-curve` 0.13 / `digest` 0.10 generation — the unifying
# `elliptic-curve` 0.14 is still pre-release — so they bring duplicate
# `digest` 0.10, `sha2` 0.10, and `hkdf` 0.12 into the tree (the `ecdsa`
# feature transitively enables the curves' bundled `sha2`-hash; `hkdf` 0.12 is
# a direct dep of `elliptic-curve` 0.13). These are warn-level duplicates that
# `deny.toml` permits (DECISIONS.md D9). We still compute the ECDSA prehash
# ourselves with our `sha2` 0.11 so arbitrary `algorithm.hash` works (the
# curves' built-in `DigestSigner` only covers one hash each), and we assemble
# JWK in JS, so the `jwk` feature stays off.
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "std"] }
p384 = { version = "0.13.1", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "std"] }
p521 = { version = "0.13.3", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "std"] }
# RSA (RSASSA-PKCS1-v1_5, RSA-PSS, RSA-OAEP). Same `digest` 0.10 generation as
# the EC crates above, so it reuses the already-present `sha2` 0.10 / `digest`
# 0.10 (adds only `sha1` 0.10 within that cluster). Its `sha1`/`sha2` features
# re-export those hashes (with OID) for DigestInfo prefixes.
rsa = { version = "0.9.10", default-features = false, features = ["std", "sha2"] }
# digest-0.10 SHA-1 *with OID*, only for RSA's DigestInfo prefix (`rsa`
# re-exports `sha2` but not `sha1`). Our primary SHA-1 stays `sha1` 0.11; this
# 0.10 line is already in the tree via `rsa`, so it adds no new version.
sha1_rsa = { package = "sha1", version = "0.10.6", features = ["oid"] }
# `runtime:hashing` (DECISIONS.md D57). The digests `crypto.subtle` does not
# carry, plus the non-cryptographic hashes a server reaches for (cache keys,
# ETags, shard selection) and the password hashes `subtle` has no answer to.
#
# `sha3`, `md-5` and `ripemd` sit on `digest` 0.11 — the same generation as
# `sha2`/`sha1`/`hmac` above — so they add algorithms, not a third hash tree.
# `blake3` is standalone (its own tree hash, no `digest` dependency unless the
# `traits-preview` feature is asked for, which we do not).
#
# `sha3` is held at 0.11, not 0.12: 0.12 implements its hashes directly rather
# than through `digest`'s block-level `CoreProxy`, which is exactly what
# `Hmac<H>` is generic over — so on 0.12 there is no HMAC-SHA3 at all.
sha3 = "0.11.0"
md-5 = "0.11.0"
ripemd = "0.2.0"
blake3 = "1.8.6"
# The non-cryptographic set. `twox-hash`, `crc32fast` and `crc32c` were already
# in the tree transitively; naming them here makes the dependency deliberate
# rather than inherited. `random` is off: it pulls `rand` only to seed a
# HashMap hasher, which is not how this runtime gets randomness (D9).
twox-hash = { version = "2.1.3", default-features = false, features = ["std", "alloc", "xxhash64", "xxhash3_64"] }
crc32fast = "1.5.0"
crc32c = "0.6.8"
# Password hashing. `getrandom` is off on all three: a salt is drawn by the JS
# side from `crypto.getRandomValues`, so it comes from the Entropy provider like
# every other random byte here, and the ops stay pure computation (D57).
# `argon2` 0.5 and `scrypt` 0.11 are held to one `password-hash` generation
# (0.5) so both speak the same PHC traits and one parser reads every string we
# write; `argon2` 0.6 and `password-hash` 0.6 are still rc/new enough that
# floating onto them would split that. The cost is `scrypt` 0.11's older KDF
# deps (`pbkdf2` 0.12, `salsa20` 0.10) arriving as warn-level duplicates, which
# `deny.toml` permits — the same trade already recorded for the EC crates.
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
bcrypt = { version = "0.19.3", default-features = false, features = ["std"] }
scrypt = { version = "0.11.0", default-features = false, features = ["simple"] }
# Constant-time byte comparison for `timingSafeEqual`. Already in the tree via
# the RustCrypto stack; direct here because the export is a public promise.
subtle = "2.6.1"
# Glob matching + directory walking for runtime:fs `Glob` (DECISIONS D25):
# globset gives `**`/`{a,b}` semantics, walkdir the traversal we confine to the
# root jail. Both permissive (MIT / Unlicense). Used only by default-providers.
globset = "0.4.16"
walkdir = "2.5.0"
# Self-update for `esrun upgrade`: finds the latest GitHub release for the
# target, downloads + extracts it, and replaces the running binary in place
# (rustls TLS, no OpenSSL). Used only by runtime-cli.
self_update = { version = "1.0.0-rc.6", default-features = false, features = [
    "github",
    "reqwest",
    "rustls",
    "progress-bar",
    "archive-tar",
    "archive-zip",
    "compression-tar-gz",
    "compression-zip-deflate",
] }

# Internal crates, referenced by path so the dependency graph is the boundary
# (DECISIONS.md D11).
es-runtime-common = { path = "crates/common", version = "0.24.0" }
es-runtime-engine = { path = "crates/engine", version = "0.24.0" }
es-runtime-providers = { path = "crates/providers", version = "0.24.0" }
es-runtime = { path = "crates/runtime", version = "0.24.0" }
es-runtime-default-providers = { path = "crates/default-providers", version = "0.24.0" }
es-runtime-cli-common = { path = "crates/cli-common", version = "0.24.0" }
# TypeScript/JSX type-stripping for `esdev` (DECISIONS D59). Confined to
# `dev-cli`: the transform runs on the developer's machine, never in `esrun`,
# so the production binary gains neither the dependency nor the surface.
#
# The umbrella crate rather than the six pieces separately — it exists to keep
# their versions in step, and they are released together. Four optional
# features are on and the rest deliberately off: `transformer` (the TS/JSX
# stripping itself), `semantic` (the transformer needs scoping information),
# `codegen` (printing the stripped AST back to JavaScript), and
# `isolated_declarations` (the `.d.ts` files `esdev build --lib` emits — the
# declarations are derived from the source's own annotations, never inferred,
# which is the same "erased, never checked" contract the stripper has).
# `minifier`, `mangler` and `cfg` stay off — none is needed to run a file, and
# rolldown carries its own minifier.
#
# Deliberately *not* here: `oxc_linter` and `oxc_formatter`. Neither is
# published as a usable library (the formatter's versions are yanked, the
# linter has never been published), so either would mean a git dependency —
# the first exception to D7's pinned-crates.io rule. `oxlint` and `oxfmt` are
# npm binaries that already work.
oxc = { version = "0.144.0", features = [
    "transformer",
    "semantic",
    "codegen",
    "isolated_declarations",
] }
# The bundler behind `esdev build` (DECISIONS D59), and confined to `dev-cli`
# for the same reason `oxc` is: bundling happens on the developer's machine, and
# `esrun` runs the artifact rather than producing it.
#
# Rolldown rather than a hand-rolled linker over `oxc`: CommonJS-to-ESM
# conversion, `exports`-condition resolution and tree-shaking are each a project
# in their own right, and this is the same bundler Vite 8 uses — so the output
# shape is one the ecosystem already targets. It is published to crates.io under
# MIT and sits on the same `oxc` generation already in the tree.
#
# The Rust API is the less-travelled path (rolldown's supported surface is its
# napi binding), so it is pinned exactly rather than floated.
rolldown = "=1.2.3"
# The types a rolldown *plugin* speaks — `ModuleType` for what a transform hook
# says it produced, and anyhow's `Result`, which is the error type rolldown's
# hook signatures use. Both are already in the graph via `rolldown` itself, so
# naming them adds no crate; they are named because a plugin cannot be written
# against re-exports that do not exist. Pinned with rolldown, since a plugin is
# written against one version of its host.
rolldown_common = "=1.2.3"
anyhow = "1.0.104"


# The HTML tokenizer behind an `index.html` target (DECISIONS D61), and confined
# to `dev-cli` with the other two: an HTML file is a build input on a
# developer's machine, and `esrun` never parses one.
#
# It emits **byte spans**, which is what picked it. What this does is find the
# script and link tags that name build inputs and point them at what was built —
# and with a span, that is a splice into the original text, so every byte the
# build did not decide to change is the byte the author wrote. A DOM would have
# to be serialised back, reformatting quotes, entities and self-closing tags in
# somebody's file; a regex over HTML would find references inside comments,
# `<script>` strings and `<textarea>`, all of which this correctly does not.
#
# MIT, one transitive dependency (jetscii, MIT OR Apache-2.0). Considered and
# rejected: lol-html, whose selector engine is MPL-2.0 (four Servo crates) —
# copyleft, which deny.toml fails by policy (D10).
html5gum = "0.8.4"
# Filesystem events for `esdev --watch` (DECISIONS D59). Confined to `dev-cli`:
# nothing in production watches anything. 8.2.0 rather than the 9.0 release
# candidates, per D7 — a pre-release is taken only when it is the only option
# (as `turso_core` is), and here it is not.
notify = "8.2.0"
# Debug info dominates `target/` disk on a V8-sized dependency graph (tens of
# GB). Keep it lean: our own crates keep line tables so panic backtraces still
# resolve to file:line; dependencies — the bulk, rarely stepped through — carry
# none. `build-override` is deliberately left untouched, so build scripts and
# the from-source V8 build are unaffected (no expensive rebuild).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.rsa]
opt-level = 3
debug = false

# Release tuning for the Rust-side hot paths (op marshaling, URL serialization,
# RustCrypto). V8 itself is a prebuilt static library, so this doesn't change
# engine performance — only our code. `panic = "abort"` is deliberately *not*
# set: panic containment at the V8 boundary relies on unwinding (D15).
[profile.release]
lto = "thin"
codegen-units = 1
# Integer overflow is a bug, and a silently wrapped counter in a parser reading
# untrusted input is a security bug — the guest chooses the input. Fuzzing found
# exactly that in `urlpattern` 0.6.0 (an unmatched `]` underflows its IPv6
# bracket depth), where wrapping would have left the parser in a nonsense state
# and misparsed the pattern rather than failing. Checked here so it is a
# contained exception instead, at a cost that does not show in the benchmarks
# (the hot paths are V8's, and V8 is a prebuilt static library this never
# touches).
overflow-checks = true
# Ship stripped: 80 MB → 63 MB, a fifth of what users download.
#
# There is no DWARF in this binary to remove — release builds carry none, and
# `readelf` reports zero debug sections. The 17 MB is the *symbol table*, nearly
# all of it names from the prebuilt V8 static library. `strip = "debuginfo"`
# therefore does nothing here; only `true` reaches it.
#
# What that costs: a `RUST_BACKTRACE=1` panic report gives addresses rather than
# function names. Acceptable because panics at the V8 boundary are caught and
# reported as a JS-visible error rather than a crash (D15), and because a
# developer chasing one can rebuild unstripped — while every user pays the 17 MB
# on every download. Node, Deno and Bun all ship stripped for the same reason.
strip = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "forbid"      # DECISIONS.md D1
missing_docs = "warn"

[workspace.lints.clippy]
# CI runs `clippy -D warnings`; these raise specific hazards to the default
# (warn) level so they surface there. Pedantic groups are intentionally not
# enabled wholesale — they add noise without commensurate signal at this stage.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"                   # ARCHITECTURE.md §8: no println!
print_stderr = "warn"
